[package]
name = "fiyatlio"
version = "0.3.1"
description = "Binance spot trading analysis desktop application (FIFO / Average Cost P&L)"
authors = ["Fiyatlio"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
default-run = "fiyatlio"

# The library target holds all application logic so that integration tests under
# `tests/` can link against it. `main.rs` stays a thin launcher.
[lib]
name = "fiyatlio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "^2", features = [] }

[dependencies]
# --- Tauri core + plugins -------------------------------------------------
tauri = { version = "^2", features = [] }
tauri-plugin-dialog = "^2"   # native file picker (multi-select CSV, save dialog)
tauri-plugin-fs = "^2"       # scoped report / export writing
tauri-plugin-store = "^2"    # persisted settings, price cache, last session
tauri-plugin-opener = "^2"   # open generated report in the default browser

# --- Serialization --------------------------------------------------------
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"

# --- CSV + time -----------------------------------------------------------
csv = "^1.3"
chrono = { version = "^0.4", features = ["serde", "clock"] }

# --- Money -----------------------------------------------------------------
# `serde-with-str` gives us `rust_decimal::serde::str` / `str_option`, which we use
# on every monetary field so the frontend receives exact decimal strings instead
# of lossy JSON floats.
rust_decimal = { version = "^1.36", features = ["serde-with-str", "maths"] }
rust_decimal_macros = "^1.36"

# --- HTTP (Binance public API; no API key required) -----------------------
reqwest = { version = "^0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
tokio = { version = "^1", features = ["sync", "time", "rt", "macros"] }

# --- Errors + logging -----------------------------------------------------
thiserror = "^2"
tracing = "^0.1"
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }

# --- Misc ------------------------------------------------------------------
regex = "^1"
once_cell = "^1"

[dev-dependencies]
pretty_assertions = "^1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
