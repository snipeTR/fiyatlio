[project]
name = "fiyatlio"
version = "2.0.0"
description = "Binance spot maliyet, çuval ve dönem analizi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "rich>=13.7",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fiyatlio = "fiyatlio.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
