# .github/workflows/build.yml
#
# Produces the actual Windows installers (NSIS .exe + MSI) with `tauri build`.
#
# Triggers:
#   * push to main            -> artifacts attached to the run (30 day retention)
#   * push of a `v*` tag      -> same artifacts PLUS a draft GitHub Release
#   * manual (workflow_dispatch)
#
# Kept out of ci.yml on purpose: a full Tauri build takes several minutes on a
# Windows runner, and private repositories bill Windows minutes at 2x.

name: Build (Windows)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # required to create the release on tag builds

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: tauri build (x86_64-pc-windows-msvc)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # Icons are committed (see .gitignore), so no `tauri icon` step is needed.
      # If src-tauri/icons/icon.ico is ever missing, tauri-build fails early with
      # a clear message — regenerate with: npm run tauri icon app-icon.png

      - name: Build installers
        run: npm run tauri build

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: fiyatlio-nsis-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: fiyatlio-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Create draft release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
